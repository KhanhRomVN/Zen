<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zen – Wireframe responsive (sidebar → maximize)</title>
    <style>
      :root {
        --bg: #08090c;
        --panel: #0e1117;
        --line: #2a303b;
        --line2: #3a4252;
        --txt: #cfd6e0;
        --mute: #7c8696;
        --accent: #4c8dff;
        --note: #e0b341;
        --ph: #161b24;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #15181f;
        color: var(--txt);
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
        padding: 16px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      /* ===== Toolbar điều khiển (không thuộc UI) ===== */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0f1218;
      }
      .toolbar .grp {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .toolbar label {
        color: var(--mute);
      }
      #w {
        width: 260px;
      }
      #bp {
        font-family: ui-monospace, monospace;
        color: var(--note);
      }
      .stage {
        overflow-x: auto;
        padding-bottom: 12px;
      }

      /* ===== Khung mô phỏng secondary sidebar ===== */
      .frame {
        container-type: inline-size;
        container-name: zen;
        background: var(--bg);
        border: 1px solid var(--line2);
        height: 720px;
        position: relative;
        overflow: hidden;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Header */
      .hdr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 22px;
        height: 22px;
        border: 1px dashed var(--line2);
        border-radius: 6px;
      }
      .brand {
        font-weight: 600;
      }
      .ver {
        font-size: 11px;
        color: var(--accent);
      }
      .nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .nav button {
        padding: 3px 8px;
        font-size: 12px;
        border-color: transparent;
      }
      .nav button.on {
        background: var(--ph);
        color: var(--txt);
        border-color: var(--accent);
      }
      .nav .lb {
        display: none;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }

      /* Placeholder chung */
      .ph {
        background: var(--ph);
        border: 1px dashed var(--line2);
        border-radius: 8px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      .mut {
        color: var(--mute);
      }
      .big {
        font-size: 20px;
        font-weight: 600;
      }
      .chip {
        display: inline-block;
        border: 1px solid var(--line2);
        border-radius: 4px;
        padding: 0 6px;
        font-size: 11px;
        color: var(--mute);
      }
      .note {
        display: block;
        margin: 6px 0;
        padding: 3px 8px;
        border-left: 2px solid var(--note);
        color: var(--note);
        font-size: 11px;
        background: rgba(224, 179, 65, 0.07);
      }
      body.hide-notes .note {
        display: none;
      }

      /* ===== HOME ===== */
      .home {
        padding: 12px;
        display: grid;
        gap: 12px;
        align-content: start;
        width: 100%;
        margin: 0 auto;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "note" "banner" "date" "stats" "dist" "usage" "recent" "top" "prov";
      }
      .home .note {
        grid-area: note;
        margin: 0;
      }
      .banner {
        grid-area: banner;
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px dashed var(--note);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .banner .ic {
        width: 34px;
        height: 34px;
        flex: none;
      }
      .banner p {
        color: var(--mute);
      }
      .datebar {
        grid-area: date;
        display: flex;
        gap: 8px;
      }
      .datebar .ph {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 6px 12px;
      }
      .datebar .seg {
        flex: none;
      }
      .datebar .seg span:not(:first-child) {
        display: none;
      }
      .datebar .nv {
        flex: 1;
      }
      .stats {
        grid-area: stats;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .stat .ic {
        width: 26px;
        height: 26px;
        margin-bottom: 8px;
      }
      .stat .txt {
        min-width: 0;
      }
      .c-dist {
        grid-area: dist;
      }
      .c-usage {
        grid-area: usage;
        display: flex;
        flex-direction: column;
      }
      .c-prov {
        grid-area: prov;
      }
      .c-recent {
        grid-area: recent;
      }
      .c-top {
        grid-area: top;
      }
      .c-recent,
      .c-top,
      .c-prov {
        display: none;
      }
      .card-hd {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .dist-in {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-top: 12px;
      }
      .donut {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 14px solid var(--accent);
        border-right-color: #c9a21a;
        flex: none;
      }
      .chart {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 10px;
      }
      .bars {
        flex: 1;
        min-height: 150px;
        display: flex;
        align-items: flex-end;
        gap: 3px;
        background: repeating-linear-gradient(
          to top,
          transparent 0,
          transparent calc(25% - 1px),
          var(--line) calc(25% - 1px),
          var(--line) 25%
        );
      }
      .bars i {
        flex: 1;
        background: var(--accent);
        opacity: 0.5;
        border-radius: 2px 2px 0 0;
      }
      .bars i.pk {
        opacity: 1;
      }
      .xl {
        display: flex;
        justify-content: space-between;
        color: var(--mute);
        font-size: 11px;
        margin-top: 4px;
      }
      .row2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 90px auto;
        gap: 10px;
        align-items: center;
        padding: 5px 0;
        font-size: 12px;
      }
      .row2 .trunc {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .c-recent .li.more {
        display: none;
      }
      .c-recent .li .chip {
        font-size: 10px;
      }

      @container zen (min-width:560px) {
        .nav .lb {
          display: inline;
        }
        .stat {
          display: flex;
          gap: 10px;
          align-items: center;
        }
        .stat .ic {
          margin: 0;
          flex: none;
        }
        .stat .big {
          font-size: 15px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
      @container zen (min-width:760px) {
        .stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      @container zen (min-width:900px) {
        .home {
          padding: 20px 28px;
          gap: 16px;
          grid-template-columns: minmax(0, 1.8fr) minmax(300px, 1fr);
          grid-template-areas: "note note" "date banner" "stats stats" "usage dist" "usage prov" "recent top";
        }
        .datebar .seg span:not(:first-child) {
          display: inline;
        }
        .datebar .nv {
          flex: none;
          min-width: 240px;
        }
        .banner {
          padding: 6px 10px;
        }
        .banner .ic {
          width: 24px;
          height: 24px;
        }
        .banner p {
          display: none;
        }
        .c-prov,
        .c-recent,
        .c-top {
          display: block;
        }
        .bars {
          min-height: 220px;
          gap: 6px;
        }
        .donut {
          width: 110px;
          height: 110px;
        }
      }
      @container zen (min-width:1300px) {
        .home {
          max-width: 1440px;
          grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr);
          grid-template-areas: "note note note" "date date banner" "stats stats stats" "usage usage dist" "usage usage prov" "recent top top";
        }
        .bars {
          min-height: 300px;
          gap: 8px;
        }
        .c-recent .li.more {
          display: flex;
        }
      }

      /* ===== CHAT (master-detail) ===== */
      .chat-layout {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr;
      }
      .hist,
      .insp {
        display: none;
        flex-direction: column;
        min-height: 0;
      }
      .hist {
        border-right: 1px solid var(--line);
      }
      .insp {
        border-left: 1px solid var(--line);
      }
      .side-hd {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .side-hd .ph {
        flex: 1;
        padding: 5px 8px;
        color: var(--mute);
      }
      .hitem {
        padding: 8px 12px;
        border-bottom: 1px solid #151a22;
      }
      .hitem.sel {
        background: #121826;
        border-left: 2px solid var(--accent);
      }
      .hitem .t {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hitem .m {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 3px;
        font-size: 11px;
        color: var(--mute);
      }
      .grp-lb {
        padding: 8px 12px 4px;
        font-size: 11px;
        color: var(--mute);
      }

      .chat {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .chat-hd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .chat-hd .ttl {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-hd .r {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .msgs {
        flex: 1;
        overflow: auto;
        padding: 12px;
      }
      .msgs-in {
        max-width: 100%;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .bubble {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--panel);
      }
      .bubble.user {
        background: #10151e;
      }
      .metrics {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        font-size: 11px;
        color: var(--mute);
        font-family: ui-monospace, monospace;
      }
      .tool {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .tool .th {
        padding: 6px 10px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
      }
      .tool pre {
        padding: 10px;
        font:
          12px ui-monospace,
          monospace;
        overflow: auto;
        white-space: pre-wrap;
      }
      .composer {
        padding: 10px 12px;
        border-top: 1px solid #151a22;
      }
      .composer-in {
        max-width: 100%;
        margin: 0 auto;
      }
      .inputbox {
        border: 1px solid var(--line2);
        border-radius: 8px;
        padding: 10px;
      }
      .inputbox .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        align-items: center;
      }
      .inputbox .row i {
        width: 20px;
        height: 20px;
        border: 1px dashed var(--line2);
        border-radius: 4px;
      }
      .inputbox .row b {
        margin-left: auto;
      }
      .only-narrow {
        display: inline-block;
      }

      .insp .sec {
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .insp h4 {
        font-size: 12px;
        margin-bottom: 8px;
      }
      .meter {
        height: 8px;
        border-radius: 4px;
        background: var(--ph);
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        width: 34%;
        background: var(--accent);
      }
      .li {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 3px 0;
        font-size: 12px;
        color: var(--mute);
      }

      @container zen (min-width:700px) {
        .msgs-in,
        .composer-in {
          max-width: 760px;
        }
        .msgs {
          padding: 20px;
        }
      }
      @container zen (min-width:900px) {
        .chat-layout {
          grid-template-columns: 260px 1fr;
        }
        .hist {
          display: flex;
        }
        .only-narrow {
          display: none;
        }
      }
      @container zen (min-width:1300px) {
        .chat-layout {
          grid-template-columns: 280px 1fr 320px;
        }
        .insp {
          display: flex;
        }
        .msgs-in,
        .composer-in {
          max-width: 820px;
        }
      }

      /* ===== HISTORY (view đầy đủ) ===== */
      .hist-view {
        display: grid;
        grid-template-columns: 1fr;
        align-content: start;
      }
      .hist-view .hitem {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 0 12px 8px;
      }
      .hist-view .grp-lb {
        grid-column: 1/-1;
      }
      @container zen (min-width:700px) {
        .hist-view {
          grid-template-columns: 1fr 1fr;
          padding: 0 6px;
        }
      }
      @container zen (min-width:1100px) {
        .hist-view {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* ===== ACCOUNTS ===== */
      .acc-top {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        align-items: center;
      }
      .acc-top .ph {
        flex: 1;
        min-width: 160px;
        padding: 6px 10px;
        color: var(--mute);
      }
      .acc-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 0 12px 12px;
      }
      .acc {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
      }
      .acc .ic {
        width: 32px;
        height: 32px;
        flex: none;
      }
      .acc .n {
        font-weight: 600;
      }
      .acc .e {
        color: var(--mute);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acc .s {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: var(--mute);
        margin-top: 2px;
        flex-wrap: wrap;
      }
      .acc .x {
        min-width: 0;
      }
      @container zen (min-width:620px) {
        .acc-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @container zen (min-width:980px) {
        .acc-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .acc-top {
          padding: 16px 28px;
        }
        .acc-grid {
          padding: 0 28px 20px;
        }
      }
      @container zen (min-width:1400px) {
        .acc-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* ===== SETTINGS ===== */
      .set {
        display: grid;
        grid-template-columns: 1fr;
        flex: 1;
        min-height: 0;
      }
      .set-nav {
        display: flex;
        gap: 4px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        overflow: auto;
      }
      .set-nav button {
        border-color: transparent;
        white-space: nowrap;
      }
      .set-nav button.on {
        background: var(--ph);
        color: var(--txt);
        border-color: var(--accent);
      }
      .set-body {
        padding: 12px;
        display: grid;
        gap: 14px;
        align-content: start;
        overflow: auto;
      }
      .field label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .field .ph {
        padding: 8px 10px;
        color: var(--mute);
      }
      .set-sec {
        display: grid;
        gap: 12px;
      }
      @container zen (min-width:900px) {
        .set {
          grid-template-columns: 220px 1fr;
        }
        .set-nav {
          flex-direction: column;
          border-bottom: 0;
          border-right: 1px solid var(--line);
          padding: 16px 10px;
        }
        .set-body {
          padding: 24px 32px;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 20px 28px;
        }
        .set-body .full {
          grid-column: 1/-1;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="grp">
        <label>Chiều rộng:</label>
        <button data-w="380">380 (sidebar)</button>
        <button data-w="640">640</button>
        <button data-w="960">960</button>
        <button data-w="1280">1280</button>
        <button data-w="1600">1600 (maximize)</button>
      </div>
      <div class="grp">
        <input id="w" type="range" min="340" max="1700" value="380" />
        <span id="bp"></span>
      </div>
      <div class="grp">
        <label>Màn hình:</label>
        <button data-v="home">Home</button>
        <button data-v="chat">Chat</button>
        <button data-v="history">History</button>
        <button data-v="accounts">Accounts</button>
        <button data-v="settings">Settings</button>
      </div>
      <div class="grp"><button id="tn">Ẩn/hiện ghi chú</button></div>
    </div>

    <div class="stage">
      <div class="frame" id="frame" style="width: 380px">
        <div class="app">
          <div class="hdr">
            <div class="logo"></div>
            <span class="brand">Zen</span><span class="ver">v2.4.4</span>
            <div class="nav" id="nav"></div>
          </div>
          <div class="view" id="view"></div>
        </div>
      </div>
    </div>
